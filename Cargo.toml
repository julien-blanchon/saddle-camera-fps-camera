[package]
name = "saddle-camera-fps-camera"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/julien-blanchon/saddle-camera-fps-camera"
license = "MIT-0"
description = "Reusable first-person camera and locomotion-aware view-motion toolkit for Bevy"

[dependencies]
bevy = { version = "0.18", features = ["serialize"] }

[workspace]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
