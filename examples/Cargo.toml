[workspace]
members = [
    "common",
    "basic",
    "external_motion",
    "grounded",
    "effects",
    "tactical",
    "comfort",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.18", features = ["serialize"] }
avian3d = "0.6"
bevy_flair = "0.7"
bevy_enhanced_input = "0.24"
bevy_input_focus = "0.18"
bevy_ui_widgets = "0.18"
saddle-camera-fps-camera = { path = ".." }
saddle-character-controller = { git = "https://github.com/julien-blanchon/saddle-character-controller" }
saddle-pane = { git = "https://github.com/julien-blanchon/saddle-pane" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
